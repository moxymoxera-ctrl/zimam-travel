version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=your-secret-key
      - DJANGO_DEBUG=False
      - DB_NAME=travel_management_db
      - DB_USER=zimam
      - DB_PASSWORD=your-db-password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=travel_management_db
      - POSTGRES_USER=zimam
      - POSTGRES_PASSWORD=your-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/static
      - media_files:/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
  media_files:
